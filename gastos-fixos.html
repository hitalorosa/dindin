<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dindin 💰 — Gastos Fixos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <h1>💰 Dindin</h1>
    <span class="dolar" id="dolar-valor">Carregando...</span>
  </header>

  <nav class="nav-tabs">
    <a href="index.html"         class="tab-btn">📊 Visão</a>
    <a href="transacoes.html"    class="tab-btn">💸 Transações</a>
    <a href="gastos-fixos.html"  class="tab-btn active">📋 Fixos</a>
    <a href="salario.html"       class="tab-btn">💼 Salário</a>
    <a href="cartao.html"        class="tab-btn">💳 Cartão</a>
    <a href="investimentos.html" class="tab-btn">📈 Invest.</a>
  </nav>

  <main class="container">

    <!-- RESUMO DO MÊS -->
    <div class="cards">
      <div class="card">
        <p>Total Fixo</p>
        <h2 id="total-fixo" style="color:#a78bfa;">R$ 0,00</h2>
      </div>
      <div class="card">
        <p>Já Pago</p>
        <h2 id="total-pago" style="color:#34d399;">R$ 0,00</h2>
      </div>
      <div class="card card-livre">
        <p>Ainda em Aberto</p>
        <h2 id="total-aberto">R$ 0,00</h2>
      </div>
    </div>

    <!-- BARRA DE PROGRESSO DO MÊS -->
    <div class="card-bloco">
      <div class="bloco-header">
        <span>📅 Progresso do Mês</span>
        <span id="progresso-label">0 de 0 pagos</span>
      </div>
      <div class="termometro-barra">
        <div class="termometro-fill" id="progresso-fill"></div>
      </div>
      <div class="fixos-acoes-topo">
        <button id="btn-reset-mes" class="btn-reset">🔄 Reiniciar mês</button>
      </div>
    </div>

    <!-- FORMULÁRIO NOVO GASTO FIXO -->
    <div class="card-bloco">
      <div class="bloco-header">
        <span>➕ Novo Gasto Fixo</span>
      </div>
      <form id="form-fixo">
        <input type="text" id="nome-fixo" placeholder="Nome (ex: Aluguel, Internet, Academia...)" required />
        <input type="number" id="valor-fixo" placeholder="Valor mensal (ex: 1200)" step="0.01" required />
        <div style="display:flex; gap:8px;">
          <input type="text" id="icone-fixo" placeholder="Ícone (ex: 🏠 📡 💪)" maxlength="4" style="width:100px; flex-shrink:0;" />
          <select id="categoria-fixo" style="flex:1;">
            <option value="Moradia">🏠 Moradia</option>
            <option value="Assinatura">📱 Assinatura</option>
            <option value="Saúde">💊 Saúde</option>
            <option value="Educação">📚 Educação</option>
            <option value="Transporte">🚗 Transporte</option>
            <option value="Alimentação">🍔 Alimentação</option>
            <option value="Lazer">🎮 Lazer</option>
            <option value="Outros">📦 Outros</option>
          </select>
        </div>
        <button type="submit">Adicionar Gasto Fixo</button>
      </form>
    </div>

    <!-- LISTA DE GASTOS FIXOS -->
    <div class="lista-section">
      <h3>Contas do Mês</h3>
      <ul id="lista-fixos"></ul>
    </div>

  </main>

  <script src="js/app.js"></script>
  <script src="js/gastos-fixos.js"></script>
</body>
</html>
