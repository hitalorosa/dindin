<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dindin 💰 — Salário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <h1>💰 Dindin</h1>
    <span class="dolar" id="dolar-valor">Carregando...</span>
  </header>

  <nav class="nav-tabs">
    <a href="index.html"        class="tab-btn">📊 Visão</a>
    <a href="transacoes.html"   class="tab-btn">💸 Transações</a>
    <a href="gastos-fixos.html" class="tab-btn">📋 Fixos</a>
    <a href="salario.html"      class="tab-btn active">💼 Salário</a>
    <a href="cartao.html"        class="tab-btn">💳 Cartão</a>
    <a href="investimentos.html" class="tab-btn">📈 Invest.</a>
  </nav>

  <main class="container">

    <!-- CARDS DE RESUMO -->
    <div class="cards">
      <div class="card">
        <p>Por Pagamento</p>
        <h2 id="sal-por-pgto" style="color:#a78bfa;">R$ 0,00</h2>
      </div>
      <div class="card">
        <p>Mensal (2x)</p>
        <h2 id="sal-mensal" style="color:#34d399;">R$ 0,00</h2>
      </div>
      <div class="card card-livre">
        <p>Projeção Anual</p>
        <h2 id="sal-anual">R$ 0,00</h2>
      </div>
    </div>

    <!-- CONFIGURAÇÃO -->
    <div class="card-bloco">
      <div class="bloco-header">
        <span>⚙️ Configuração do Salário</span>
      </div>

      <div class="sal-config-row">
        <label class="sal-label">Valor por pagamento</label>
        <div class="limite-config">
          <input type="number" id="input-sal-valor" placeholder="Ex: 1150" step="0.01" />
          <button id="btn-sal-salvar">Salvar</button>
        </div>
      </div>

      <div class="sal-config-row">
        <label class="sal-label">Dias de pagamento</label>
        <div class="sal-dias">
          <span class="sal-dia-badge" id="badge-dia-1"></span>
          <span class="sal-dia-badge" id="badge-dia-2"></span>
        </div>
      </div>

      <div class="sal-config-row">
        <label class="sal-label">Próximo pagamento</label>
        <span class="sal-proximo" id="sal-proximo">—</span>
      </div>

      <!-- REGISTRAR MANUAL -->
      <button id="btn-registrar-manual" class="btn-registrar-manual">
        + Registrar recebimento manualmente
      </button>
    </div>

    <!-- HISTÓRICO -->
    <div class="lista-section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="margin-bottom:0;">📅 Histórico de Recebimentos</h3>
        <span id="sal-total-recebido" style="font-size:0.82rem; color:#34d399;"></span>
      </div>
      <ul id="lista-historico-sal"></ul>
    </div>

  </main>

  <script src="js/app.js"></script>
  <script src="js/salario.js"></script>
</body>
</html>
