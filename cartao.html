<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dindin 💰 — Cartão de Crédito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <h1>💰 Dindin</h1>
    <span class="dolar" id="dolar-valor">Carregando...</span>
  </header>

  <nav class="nav-tabs">
    <a href="index.html"         class="tab-btn">📊 Visão</a>
    <a href="transacoes.html"    class="tab-btn">💸 Transações</a>
    <a href="gastos-fixos.html"  class="tab-btn">📋 Fixos</a>
    <a href="salario.html"       class="tab-btn">💼 Salário</a>
    <a href="cartao.html"        class="tab-btn active">💳 Cartão</a>
    <a href="investimentos.html" class="tab-btn">📈 Invest.</a>
  </nav>

  <main class="container">

    <!-- PAINEL VISUAL DO CARTÃO -->
    <div class="cartao-visual">
      <div class="cartao-chip">💳</div>
      <div class="cartao-topo">
        <span class="cartao-label">Limite Total</span>
        <span class="cartao-limite-valor" id="cartao-limite-display">R$ 0,00</span>
      </div>
      <div class="cartao-meio">
        <div>
          <span class="cartao-label">Fatura Atual</span>
          <span class="cartao-fatura-valor" id="cartao-fatura-display">R$ 0,00</span>
        </div>
        <div style="text-align:right;">
          <span class="cartao-label">Disponível</span>
          <span class="cartao-disponivel-valor" id="cartao-disponivel-display">R$ 0,00</span>
        </div>
      </div>
      <div class="cartao-barra-wrap">
        <div class="cartao-barra-bg">
          <div class="cartao-barra-fill" id="cartao-barra-fill"></div>
        </div>
        <span class="cartao-pct" id="cartao-pct-label">0% utilizado</span>
      </div>
    </div>

    <!-- CONFIGURAR LIMITE -->
    <div class="card-bloco">
      <div class="bloco-header">
        <span>⚙️ Limite do Cartão</span>
        <span id="limite-atual-label" style="font-size:0.75rem; color:var(--text3);"></span>
      </div>
      <div class="limite-config">
        <input type="number" id="input-limite-cartao" placeholder="Ex: 3000" step="0.01" />
        <button id="btn-salvar-limite-cartao">Salvar</button>
      </div>
    </div>

    <!-- FORMULÁRIO NOVA COMPRA -->
    <div class="card-bloco">
      <div class="bloco-header">
        <span>🛍️ Nova Compra</span>
      </div>
      <form id="form-compra">
        <input type="text"   id="compra-nome"     placeholder="Nome da compra (ex: Amazon, Zara...)" required />
        <input type="number" id="compra-valor"     placeholder="Valor total (ex: 299,90)" step="0.01" required />
        <input type="date"   id="compra-data"      required />
        <div class="parcelas-row">
          <label class="sal-label">Parcelas</label>
          <div class="parcelas-selector" id="parcelas-selector">
            <button type="button" class="parcela-btn active" data-p="1">1x</button>
            <button type="button" class="parcela-btn" data-p="2">2x</button>
            <button type="button" class="parcela-btn" data-p="3">3x</button>
            <button type="button" class="parcela-btn" data-p="4">4x</button>
            <button type="button" class="parcela-btn" data-p="5">5x</button>
            <button type="button" class="parcela-btn" data-p="6">6x</button>
            <button type="button" class="parcela-btn" data-p="8">8x</button>
            <button type="button" class="parcela-btn" data-p="10">10x</button>
            <button type="button" class="parcela-btn" data-p="12">12x</button>
          </div>
        </div>
        <div class="compra-preview" id="compra-preview" style="display:none;">
          <span id="preview-texto"></span>
        </div>

        <!-- GASTO FIXO -->
        <label class="toggle-fixo-label" id="label-fixo">
          <div class="toggle-fixo-wrap">
            <input type="checkbox" id="compra-fixo" />
            <span class="toggle-fixo-slider"></span>
          </div>
          <div class="toggle-fixo-info">
            <span class="toggle-fixo-titulo">É um gasto fixo?</span>
            <span class="toggle-fixo-sub">Vai para a lista de Fixos e aparece todo mês</span>
          </div>
        </label>

        <button type="submit">Adicionar ao Cartão</button>
      </form>
    </div>

    <!-- FATURA DO MÊS -->
    <div class="lista-section">
      <div class="fatura-header">
        <div>
          <h3 id="fatura-titulo">Fatura — Mês Atual</h3>
          <span class="fatura-total-label" id="fatura-total-label"></span>
        </div>
        <div class="fatura-nav">
          <button class="cal-nav" id="fatura-prev">‹</button>
          <span id="fatura-mes-label" style="font-size:0.78rem; color:var(--text2); font-weight:600;"></span>
          <button class="cal-nav" id="fatura-next">›</button>
        </div>
      </div>
      <ul id="lista-fatura"></ul>
    </div>

  </main>

  <script src="js/app.js"></script>
  <script src="js/cartao.js"></script>
</body>
</html>
